name: Contact
slug: contact
module: CRM
description: "People associated with companies"

ui:
  show_in_sidebar: true
  icon: user
  default_view: summary

fields:
  - name: first_name
    label: First Name
    type: String
    required: true

  - name: last_name
    label: Last Name
    type: String
    required: true

  - name: email
    label: Email
    type: Email
    required: true

  - name: phone
    label: Phone
    type: PhoneNumber

  - name: job_title
    label: Job Title
    type: String

  - name: department
    label: Department
    type: String

  - name: status
    label: Status
    type: Select
    options:
      - Active
      - Inactive
      - Do Not Contact
    default: Active

  - name: notes
    label: Notes
    type: Text

associations:
  - type: belongs_to
    target: Company
    foreign_key: company_id

  - type: has_many
    target: Activity
    foreign_key: contact_id

views:
  - name: Summary
    id: summary
    type: summary

  - name: Activities
    id: activities
    type: association
    target: Activity

  - name: Comments
    id: comments
    type: comments

  - name: History
    id: history
    type: history
