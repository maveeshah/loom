name: Patient
module: Clinical
description: Core patient record
ui:
  show_in_sidebar: true
  icon: user
  default_view: dashboard
associations:
- type: has_many
  target: Encounter
  foreign_key: patient_id
views:
- name: Dashboard
  type: summary
  id: summary
- name: Encounters
  type: association
  target: Encounter
  id: association
- name: Comments
  type: comments
  id: comments
- name: Audit Trail
  type: history
  id: history
- name: Analytics
  type: custom
  id: analytics
overrides:
  frontend_analytics: pages/custom/PatientAnalytics.tsx
fields:
- name: first_name
  label: First Name
  type: String
  required: true
- name: last_name
  label: Last Name
  type: String
  required: true
- name: age
  label: Age
  type: Integer
- name: is_active
  label: Is Active
  type: Boolean
  default: true
slug: patient
permission_namespace: patient
table_name: patients
