name: User
module: Admin
description: "Application users"

ui:
  show_in_sidebar: true
  icon: "users"
  default_view: "dashboard"

associations:
  - type: belongs_to
    target: Role
    foreign_key: role_id

views:
  - name: Dashboard
    type: summary
  - name: Audit Trail
    type: history

fields:
  - name: email
    type: String
    required: true
  - name: full_name
    type: String
    required: true
  - name: hashed_password
    type: String
    required: true
  - name: format
    type: String
    default: "standard"
  - name: is_active
    type: Boolean
    default: true
  - name: created_at
    type: DateTime
    default: now()
  - name: updated_at
    type: DateTime
    default: now()
    onupdate: now()