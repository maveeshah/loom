name: User
module: Admin
description: Application users
ui:
  show_in_sidebar: false
  icon: users
  default_view: dashboard
associations:
- type: belongs_to
  target: Role
  foreign_key: role_id
views:
- name: Dashboard
  type: summary
  id: summary
- name: Audit Trail
  type: history
  id: history
fields:
- name: email
  label: Email
  type: String
  required: true
- name: full_name
  label: Full Name
  type: String
  required: true
- name: hashed_password
  label: Hashed Password
  type: String
  required: true
- name: format
  label: Format
  type: String
  default: standard
- name: is_active
  label: Is Active
  type: Boolean
  default: true
- name: created_at
  label: Created At
  type: DateTime
  default: now()
- name: updated_at
  label: Updated At
  type: DateTime
  default: now()
  onupdate: now()
slug: user
permission_namespace: user
table_name: users
