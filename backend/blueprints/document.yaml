name: Document
module: Clinical
description: A patient document or scan
ui:
  show_in_sidebar: true
  icon: file-text
  default_view: dashboard
associations:
- type: belongs_to
  target: Patient
  foreign_key: patient_id
views:
- name: Dashboard
  type: summary
  id: summary
- name: Preview
  type: custom
  id: preview
overrides:
  frontend_preview: pages/custom/DocumentPreview.tsx
fields:
- name: patient_id
  label: Patient ID
  type: Integer
  required: true
- name: title
  label: Title
  type: String
  required: true
- name: file_url
  label: File URL
  type: String
- name: uploaded_at
  label: Uploaded At
  type: DateTime
  default: now()
slug: document
permission_namespace: document
table_name: documents
