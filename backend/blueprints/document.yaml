name: Document
module: Clinical
description: "A patient document or scan"

ui:
  show_in_sidebar: true
  icon: "file-text"
  default_view: "dashboard"

associations:
  - type: belongs_to
    target: Patient
    foreign_key: patient_id

views:
  - name: Dashboard
    type: summary
  - name: Preview
    type: custom    # Notice this is a custom override

overrides:
  # The frontend will look for this file when the "Preview" tab is clicked
  frontend_preview: "pages/custom/DocumentPreview.tsx"

fields:
  - name: patient_id
    type: Integer
    required: true
  - name: title
    type: String
    required: true
  - name: file_url
    type: String
  - name: uploaded_at
    type: DateTime
    default: now()
