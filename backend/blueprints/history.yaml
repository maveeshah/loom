name: AuditLog
module: System
description: "Core generic history tracking system"

ui:
  show_in_sidebar: false
  icon: "clock"

fields:
  - name: model_name
    type: String
    required: true
  - name: record_id
    type: Integer
    required: true
  - name: action
    type: String
    required: true
  - name: changes
    type: String
  - name: actor
    type: String
    default: "System User"
  - name: timestamp
    type: DateTime
    default: now()
