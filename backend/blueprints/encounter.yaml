name: Encounter
module: Clinical
description: A patient visit or interaction
ui:
  show_in_sidebar: false
  icon: calendar
  default_view: dashboard
associations:
- type: belongs_to
  target: Patient
  foreign_key: patient_id
views:
- name: Dashboard
  type: summary
  id: summary
- name: Comments
  type: comments
  id: comments
- name: Audit Trail
  type: history
  id: history
fields:
- name: patient_id
  label: Patient ID
  type: Integer
  required: true
- name: encounter_date
  label: Encounter Date
  type: DateTime
  default: now()
- name: type
  label: Type
  type: String
  required: true
- name: status
  label: Status
  type: Select
  options:
  - Scheduled
  - In Progress
  - Completed
  - Cancelled
  default: Scheduled
slug: encounter
permission_namespace: encounter
table_name: encounters
