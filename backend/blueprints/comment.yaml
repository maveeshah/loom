name: Comment
module: System
description: "Core generic commenting system"

ui:
  show_in_sidebar: false
  icon: "message-square"

fields:
  - name: model_name
    type: String
    required: true
  - name: record_id
    type: Integer
    required: true
  - name: content
    type: String
    required: true
  - name: author
    type: String
    default: "System User"
  - name: created_at
    type: DateTime
    default: now()
